name = "pill-tracker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# 5分おきに起動し、その枠に該当する通知だけを送る (src/jobs/notify.ts)
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pill_tracker"
database_id = "f1752451-2acf-4ce9-801f-b84502b21477"

[vars]
# 通知やイベントに使うタイムゾーン
TZ_NAME = "Asia/Tokyo"

# シークレットは wrangler secret put で登録する (リポジトリには置かない):
#   LINE_CHANNEL_SECRET   LINE Messaging API のチャネルシークレット
#   LINE_ACCESS_TOKEN     チャネルアクセストークン (long-lived)
#   ALLOWED_LINE_USER_ID  自分の userId (U から始まる)。これ以外は無視する
#   GAS_CALENDAR_URL      カレンダー書き込みを担う GAS ウェブアプリの /exec URL
#   GAS_SHARED_SECRET     Workers ⇄ GAS の共有シークレット (32文字以上のランダム値)
