name: Watch

on:
  schedule:
    # 1日1回だけ起動し、その中で15分間隔×22回 (約5.5時間) チェックして終わる。
    # UTC 0:00 = JST 9:00。時間を変えたい場合はここを編集する。
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'テスト通知を送信する (state更新なし)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50m, GitHub Actions の6時間上限を超えないように
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 対象がJSでDOMを描画するSPAでも中身を取れるように、実ブラウザで開いている。
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Watch loop (test mode → single run; normal → loop ~5.5h, once/day)
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS: ${{ secrets.GMAIL_APP_PASS }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
          TEST_MODE: ${{ inputs.test_mode && '1' || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${TEST_MODE}" == "1" ]]; then
            node scripts/watch.mjs
            exit 0
          fi

          ITERATIONS=22  # 22回 × 15分 = 5.5h (1日1回のcronで、この5.5時間だけ監視する)
          SLEEP_SECONDS=870  # 14.5分
          NODE_EXIT=0
          HAD_ERROR=0

          for i in $(seq 1 $ITERATIONS); do
            echo "::group::Iteration $i / $ITERATIONS at $(date -u +%H:%M:%SZ)"

            # 手動実行などでstateが更新されている可能性があるので最新を取り込む
            git pull --rebase --autostash origin main || echo "pull failed, continuing"

            # `bash -e` 下では失敗やexit 20でその場で打ち切られてしまうため、
            # `|| NODE_EXIT=$?` で終了コードを受け止めてから自分で分岐する。
            NODE_EXIT=0
            node scripts/watch.mjs || NODE_EXIT=$?

            if [[ -n "$(git status --porcelain state/)" ]]; then
              git add state/
              git commit -m "chore: update watch state"
              git push || echo "push failed, will retry next iteration"
            else
              echo "no state changes"
            fi

            echo "::endgroup::"

            # 20 = 監視対象がすべて片付いた合図。ループを抜けてワークフローごと止める。
            if [[ "$NODE_EXIT" -eq 20 ]]; then
              echo "All targets are done. Stopping the watch loop."
              break
            fi

            if [[ "$NODE_EXIT" -ne 0 ]]; then
              HAD_ERROR=1
            fi

            if [[ $i -lt $ITERATIONS ]]; then
              sleep $SLEEP_SECONDS
            fi
          done

          if [[ "$NODE_EXIT" -eq 20 ]]; then
            gh workflow disable watch.yml || echo "failed to disable workflow (please disable manually from the Actions tab)"
          fi

          # 途中で失敗があった回はActions上も赤くして気づけるようにする。
          if [[ "$HAD_ERROR" -eq 1 ]]; then
            echo "::error::watch script failed at least once during this run"
            exit 1
          fi
